name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --include-workspace-root: the root is @sightspool/sdk (a workspace member), which
      # pnpm -r excludes by default. Build first so the SDK's .d.ts exists for react's
      # type-check/build (pnpm topo-orders: sdk before react).
      - run: pnpm -r --include-workspace-root build
      - run: pnpm -r --include-workspace-root type-check
      - run: pnpm -r --include-workspace-root test

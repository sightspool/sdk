name: Release

# Publishes to npm with provenance when a v* tag is pushed:
#   pnpm version patch|minor|major   # bumps package.json + creates the tag
#   git push --follow-tags
# Requires repo secret NPM_TOKEN (a granular npm token with publish rights to
# @sightspool/*). Once the package exists, this can migrate to tokenless OIDC
# trusted publishing — see the repo README / docs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

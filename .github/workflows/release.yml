name: Release

# Publishes to npm with provenance via OIDC **trusted publishing** (no token) when a
# v* tag is pushed:
#   pnpm version patch|minor|major   # bumps package.json + creates the tag
#   git push --follow-tags
#
# One-time setup on npmjs.com (required before the first tokenless publish):
#   npmjs.com → @sightspool/sdk → Settings → Trusted Publisher → GitHub Actions,
#   repository `sightspool/sdk`, workflow `release.yml` (leave Environment blank).
# Once configured, npm authenticates this workflow via OIDC (`id-token: write`) — no
# NPM_TOKEN secret. We install/build with pnpm but publish with the npm CLI, which is the
# canonical OIDC trusted-publishing client (requires npm >= 11.5.1; node 22 ships npm 10,
# so we upgrade it). This keeps the repo on pnpm 9 — no package-manager migration.
#
# After verifying a tokenless publish: delete the NPM_TOKEN repo secret and revoke the
# token on npmjs.com.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC: lets npm verify this workflow as a trusted publisher (+ provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      # Trusted publishing needs npm >= 11.5.1; node 22 ships npm 10.
      - run: npm install -g npm@11
      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived npm
      # credential (provenance is automatic under trusted publishing; kept explicit).
      - run: npm publish --provenance --access public

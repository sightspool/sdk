name: Docs site

# Optional static preview only. Production SDK docs are served by the research app.
# No automatic deployment to the former brand's GitHub Pages host on push.
# Configure a reviewed preview destination before manually dispatching this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; let an in-progress run finish (don't cancel a live deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:release
      - run: node --test scripts/docs-redirects.test.mjs
      - run: pnpm build:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .site-build
      - id: deploy
        uses: actions/deploy-pages@v5
